# Cloudflare Email Worker — קליטת מיילים ל-orders@tzidkat.com (ראו worker.js)
# פריסה:  cd infra/email-worker && npx wrangler deploy
# הסוד:   npx wrangler secret put INBOUND_SECRET   (אותו ערך כמו INBOUND_EMAIL_SECRET ב-Vercel)
name = "tzidkat-inbound"
main = "worker.js"
compatibility_date = "2026-10-01"
# אין צורך בכתובת workers.dev — ה-Worker מופעל רק ממיילים
workers_dev = false

[vars]
INBOUND_URL = "https://tzidkat.com/api/inbound/email"
CART_REMINDERS_URL = "https://tzidkat.com/api/cron/cart-reminders"
# FORWARD_TO הוסר: העותק למנהל נשלח מהאתר דרך אמזון (forwardInboundToAdmin),
# בלי תלות באימות כתובת היעד ב-Cloudflare. אם יוגדר שוב — יהיו עותקים כפולים.

# ⏰ תזכורות לסלים שלא נשלחו — כל חצי שעה (ראו scheduled ב-worker.js)
[triggers]
crons = ["*/30 * * * *"]
